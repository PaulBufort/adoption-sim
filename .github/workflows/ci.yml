name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (engine, scenarios, demo smoke)
        run: pytest -q
      - name: Experiment 1 pipeline smoke (CI-sized, same code path as the notebook)
        run: python experiments/run_experiment1.py --smoke
      - name: Editable install exposes the engine as adoption_sim
        run: |
          pip install -e .
          python -c "import adoption_sim; print('adoption_sim', adoption_sim.__version__)"
          cd /tmp && python -c "import adoption_sim.metrics, adoption_sim.scenario; print('submodules OK')"

  reproduce-headline:
    # The README's actual reproduction path, continuously verified: regenerate
    # every final figure (figures/make_all.py executes notebooks 01-03 headlessly)
    # under the known-good constraints, run the tutorial, and assert the committed
    # result CSVs reproduce bit-for-bit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Tutorial notebook executes end to end
        run: python -m jupyter nbconvert --to notebook --execute --inplace experiments/00_tutorial.ipynb
      - name: Regenerate all final figures (single command, master-seed deterministic)
        run: python figures/make_all.py
      - name: Assert bit-for-bit reproduction of committed result CSVs
        # (PNG bytes vary with platform font rendering — the numbers are the
        # reproducibility contract)
        run: git diff --exit-code experiments/results/*.csv
