name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (engine, scenarios, demo smoke)
        run: pytest -q
      - name: Experiment 1 pipeline smoke (CI-sized, same code path as the notebook)
        run: python experiments/run_experiment1.py --smoke
