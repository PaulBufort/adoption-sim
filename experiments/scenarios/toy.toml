# Tiny fast scenario for smoke tests and first contact with the engine.
# All data SYNTHETIC.

[meta]
name = "toy"
description = "300-agent organization, seconds to run."

[org]
n_agents = 300
n_departments = 3

[agents]
theta_mean = 0.30
theta_concentration = 20.0

[seeding]
strategy = "cluster"
budget = 0.05

[run]
replicates = 5
master_seed = 1
